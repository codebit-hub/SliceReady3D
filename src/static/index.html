<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SliceReady3D - Voxel Constructor</title>
    <style>
        :root {
            --bg-body: #f0f2f5; --bg-sidebar: #ffffff; --bg-scene: #e0e5ec;
            --text-main: #333333; --text-muted: #666666;
            --border-color: #dddddd; --btn-primary: #ff5252;
            --btn-hover: #e04040; --btn-secondary: #4a90e2;
        }

        [data-theme="dark"] {
            --bg-body: #121212; --bg-sidebar: #1e1e1e; --bg-scene: #2a2a2a;
            --text-main: #eeeeee; --text-muted: #aaaaaa;
            --border-color: #444444; --btn-primary: #e53935;
            --btn-secondary: #357abd;
        }

        body {
            font-family: Arial, sans-serif; margin: 0; padding: 20px;
            background-color: var(--bg-body); color: var(--text-main);
            transition: background-color 0.3s ease; min-height: 100vh;
            box-sizing: border-box;
        }

        #app-wrapper {
            display: grid; grid-template-columns: 320px 1fr;
            gap: 20px; max-width: 1400px; margin: 0 auto;
        }

        @media (max-width: 860px) {
            #app-wrapper { grid-template-columns: 1fr; }
        }

        #sidebar {
            background: var(--bg-sidebar); padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: fit-content;
        }

        #scene-container {
            position: relative; background-color: var(--bg-scene);
            border-radius: 8px; overflow: hidden;
            height: 75vh; min-height: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        canvas { display: block; width: 100%; height: 100%; outline: none; }
        h1 { font-size: 20px; margin-top: 0; display: flex; justify-content: space-between;}

        #theme-toggle {
            background: none; border: none; cursor: pointer;
            font-size: 18px; color: var(--text-main);
        }

        .form-group { margin-bottom: 20px; }
        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block; }
        select, input[type="file"] {
            width: 100%; padding: 8px; margin-bottom: 10px;
            background: var(--bg-body); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 14px;
        }
        button.primary { background-color: var(--btn-primary); color: white; padding: 12px; }
        button.primary:hover { background-color: var(--btn-hover); }
        button.secondary { background-color: var(--btn-secondary); color: white; margin-bottom: 8px; }
        button.secondary:hover { opacity: 0.9; }

        #status {
            margin-top: 15px; font-size: 13px; font-weight: bold;
            padding: 10px; border-radius: 4px; display: none;
            background: var(--bg-body); border: 1px solid var(--border-color);
        }

        #inventory-container, #export-container { margin-top: 20px; display: none; }

        .inventory-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            margin-top: 10px; font-size: 12px;
        }
        .inventory-item {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-body); padding: 5px; border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .color-swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.2); }

        #loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center;
            font-size: 20px; color: white; z-index: 5;
        }

        #controls-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 12px;
            pointer-events: none; display: flex; gap: 15px; z-index: 2; white-space: nowrap;
        }
        @media (max-width: 600px) {
            #controls-hint { flex-direction: column; gap: 5px; bottom: 10px; }
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="sidebar">
            <h1>
                SliceReady3D
                <button id="theme-toggle" title="Toggle Dark Mode">🌙</button>
            </h1>
            <p style="font-size: 13px; color: var(--text-muted);">Convert flat images into layered 3D voxel mosaics.</p>

            <form id="upload-form">
                <div class="form-group">
                    <label>1. Upload Image</label>
                    <input type="file" id="image-input" accept="image/png, image/jpeg, image/webp" required>
                </div>

                <div class="form-group">
                    <label>2. Artistic Mode</label>
                    <select id="render-mode">
                        <option value="solid">Voxel Sculpture (3D Printable)</option>
                        <option value="floating">2.5D Exploded Heightmap</option>
                        <option value="flat">Traditional Flat Mosaic</option>
                    </select>
                </div>

                <button type="submit" class="primary">Build Mosaic</button>
            </form>

            <div id="status"></div>

            <div id="export-container">
                <label>3. Scene Export</label>
                <div style="margin-top: 10px;">
                    <button id="btn-export-mesh" class="secondary">🧊 Download 3D Mesh (GLTF)</button>
                    <button id="btn-export-png" class="secondary">📷 Download Snapshot (PNG)</button>
                    <button id="btn-export-json" class="secondary">📄 Download Blueprint (JSON)</button>
                </div>
            </div>

            <div id="inventory-container">
                <label>4. Color Inventory</label>
                <div class="inventory-grid" id="inventory-grid"></div>
            </div>
        </div>

        <div id="scene-container">
            <div id="loading-overlay">Computing Volume...</div>
            <div id="controls-hint">
                <span>🖱️/👆 <b>1-Finger</b>: Rotate</span>
                <span>✌️/🖱️ <b>2-Finger</b>: Pan</span>
                <span>↕️ <b>Pinch/Scroll</b>: Zoom</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
